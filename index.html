<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1a1c1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Formula">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Formula</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('athlete-os-theme') || 'command-centre';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button type="button" class="app-logo" id="btn-home" aria-label="Return to Command Centre">&#402;</button>
      <span id="header-context" class="header-context"></span>
      <button type="button" id="btn-settings" class="btn-settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </header>

    <main id="screen-root" class="screen-root" aria-live="polite"></main>
  </div>

  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div id="overlay-content" class="overlay-panel"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
